name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: ver
        run: echo "version=$(jq -r '.version' custom_components/dohome_rgb/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v$VERSION"
          # Mark PEP 440 pre-release versions (e.g. 1.3.5b1, 2.0.0rc1, 1.4.0a2)
          # as GitHub pre-releases so HACS only offers them to users who have
          # opted into beta versions.
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE '(a|b|rc)[0-9]+$'; then
            PRERELEASE="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" $PRERELEASE --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
