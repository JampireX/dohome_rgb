name: Release

# Publish a GitHub release whenever the manifest version on main is new.
# HACS shows a version from GitHub *releases* (a bare tag is not enough); the
# release also creates its underlying tag, so no tags are managed by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release when the manifest version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version custom_components/dohome_rgb/manifest.json)"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Release $version"
            echo "Published release $tag"
          fi
